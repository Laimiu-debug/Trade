name: Rebuild platform packages

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        bundle_mode: [onedir]
        include:
          - os: windows-latest
            bundle_mode: onefile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller==6.19.0 pytest
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check architecture and runtime contract
        run: |
          python scripts/check_rebuild_architecture.py
          python scripts/generate_rebuild_tokens.py --check
          python scripts/generate_rebuild_contracts.py --check
          python -m pytest backend/tests/test_frozen_runtime.py backend/tests/test_remote_access.py -q
        env:
          PYTHONPATH: backend
      - name: Install smoke browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build immutable source snapshot
        run: python scripts/build_trade_rebuild.py ${{ matrix.bundle_mode == 'onefile' && '--onefile' || '' }}
      - name: Locate packaged executable
        shell: python
        run: |
          import json, os, pathlib, sys
          root = pathlib.Path('.release-dist')
          release = max(root.iterdir(), key=lambda p: p.name)
          meta = json.loads((release / 'release-manifest.json').read_text(encoding='utf-8'))
          package = release / meta['package_path']
          executable = release / meta['executable_path']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('TRADE_BUNDLE_EXE=' + str(executable.resolve()) + '\n')
              stream.write('TRADE_BROWSER_CHANNEL=chromium\n')
              stream.write('TRADE_BUNDLE_SINGLE_FILE=' + ('1' if meta['bundle_mode'] == 'onefile' else '0') + '\n')
      - name: Run actual packaged browser and worker smoke
        working-directory: frontend
        run: node scripts/smoke-packaged-rebuild.mjs
      - name: Archive package with Unix executable bits and symlinks
        shell: python
        run: |
          import pathlib, tarfile
          root = pathlib.Path('.release-dist')
          release = max((p for p in root.iterdir() if p.is_dir()), key=lambda p: p.name)
          with tarfile.open(root / 'TradeRebuild-verified.tar.gz', 'w:gz', dereference=False) as archive:
              archive.add(release, arcname='TradeRebuild-release')
      - uses: actions/upload-artifact@v4
        with:
          name: TradeRebuild-${{ matrix.os }}-${{ matrix.bundle_mode }}
          path: .release-dist/TradeRebuild-verified.tar.gz
          if-no-files-found: error
