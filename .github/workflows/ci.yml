name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许在 Actions 页面手动触发,便于首次验证

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          TDX_TREND_APP_STATE_PATH: ${{ github.workspace }}/backend/.test-state/app_state.json
          TDX_TREND_SIM_STATE_PATH: ${{ github.workspace }}/backend/.test-state/sim_state.json
          TDX_TREND_WYCKOFF_STORE_PATH: ${{ github.workspace }}/backend/.test-state/wyckoff_events.sqlite
          TDX_TREND_WYCKOFF_STORE_ENABLED: "1"
          TDX_TREND_WYCKOFF_STORE_READ_ONLY: "0"
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + test + lint)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint
