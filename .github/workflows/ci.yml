name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许在 Actions 页面手动触发,便于首次验证

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Rebuild architecture and design tokens
        run: |
          python ../scripts/check_project_sources.py
          python ../scripts/check_rebuild_architecture.py
          python ../scripts/generate_rebuild_tokens.py --check
          python ../scripts/check_design_tokens.py
          python ../scripts/generate_rebuild_contracts.py --check

  windows-compute:
    name: Windows source venv (compute + storage + simulation)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install into a real Windows venv
        run: |
          python -m venv .test-venv
          & .\.test-venv\Scripts\python.exe -m pip install -r backend/requirements.txt pytest
      - name: Run source worker and business regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          PYTHONUTF8: "1"
        run: |
          & .\.test-venv\Scripts\python.exe -m pytest backend/tests/test_compute_process.py backend/tests/test_frozen_runtime.py backend/tests/test_backtest_jobs.py backend/tests/test_backup_schema.py backend/tests/test_slippage_execution.py -q

  frontend:
    name: Frontend (typecheck + test + lint)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint
